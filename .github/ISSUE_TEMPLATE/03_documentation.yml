name: Documentation improvement
description: Report missing, confusing, contradictory, or inaccessible workbench documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: File, heading, or URL.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is unclear, incorrect, missing, or difficult to follow?
    validations:
      required: true

  - type: textarea
    id: reader
    attributes:
      label: Reader goal
      description: What was the reader trying to accomplish?
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Describe the improved explanation, example, or navigation.

  - type: checkboxes
    id: checked
    attributes:
      label: Checks
      options:
        - label: I searched for an existing issue covering this documentation problem.
          required: true
        - label: The report contains no private target content or sensitive data.
          required: true
