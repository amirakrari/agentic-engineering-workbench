name: Workbench scope

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reject-target-repositories:
    name: Reject tracked target repositories
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify workbench tree excludes repos
        run: bash eng/check-workbench-staging.sh --tree HEAD
